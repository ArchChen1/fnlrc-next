[project]
name = "fnlrc"
version = "0.0.2"
description = "飞牛音乐歌词补完器：多源刮削 + 双语合成 + 乱码修复 + 按飞牛规则回填"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ArchChen1" },
    { name = "Hermannmayer", email = "" },  # 原作者（fork 来源）
]
keywords = ["lyrics", "lrc", "bilingual", "fnnas", "fnos", "translation", "music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "requests>=2.31,<3",
    "mutagen>=1.47,<2",
]

[project.optional-dependencies]
# 网页版 / 桌面版共用。桌面壳也走它做后端，所以是"运行必需、打包可选"
server = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]
# 桌面壳（原生窗口）
desktop = [
    "pywebview>=5.0,<6",
]
# 打包与测试
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pyinstaller>=6.0,<7",
    # 新版 starlette 的 TestClient 依赖它（旧版用 httpx）。缺了会让 pytest
    # 在导入阶段就失败，而不是某个用例红。
    "httpx2>=0.1",
]

[project.scripts]
fnlrc = "fnlrc.__main__:main"

[project.urls]
Homepage = "https://github.com/ArchChen1/fnlrc-next"
Issues = "https://github.com/ArchChen1/fnlrc-next/issues"
Upstream = "https://github.com/Hermannmayer/fnlrc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fnlrc"]

[tool.pytest.ini_options]
addopts = "-q -m 'not network'"
markers = [
    "network: 需要联网的端到端测试（CI 默认跳过）",
]

[tool.coverage.run]
source = ["fnlrc"]
omit = ["fnlrc/web/*"]
